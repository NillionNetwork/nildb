name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

  build-and-push-arch:
    needs: setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Create build info
        run: mise run create-buildinfo

      - name: Build and push arch-specific image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./packages/api/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/nillionnetwork/nildb:${{ needs.setup.outputs.short_sha }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attach build provenance and an SBOM so a published image can be
          # traced back to the commit and workflow that produced it.
          provenance: mode=max
          sbom: true

  create-and-push-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [setup, build-and-push-arch]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/nillionnetwork/nildb
          tags: |
            type=raw,value=${{ needs.setup.outputs.short_sha }}
            type=ref,event=branch

      - name: Create and push multi-arch manifest
        run: |
          IMAGE_BASE="ghcr.io/nillionnetwork/nildb"
          AMD64_IMAGE="${IMAGE_BASE}:${{ needs.setup.outputs.short_sha }}-amd64"
          ARM64_IMAGE="${IMAGE_BASE}:${{ needs.setup.outputs.short_sha }}-arm64"

          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "Creating and pushing manifest for tag: ${tag}"
              docker manifest create "${tag}" "${AMD64_IMAGE}" "${ARM64_IMAGE}"
              docker manifest push "${tag}"
            fi
          done

  deploy-to-ci-cluster:
    needs: [setup, create-and-push-manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref_name == 'main'
    strategy:
      matrix:
        node: ["ci-n1", "ci-n2", "ci-n3"]
    steps:
      - name: Dispatch event to start nildb-infra/.github/workflows/ecs-${{ matrix.node }}.yaml workflow
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/NillionNetwork/nildb-infra/dispatches \
            -d '{
              "event_type":"trigger-on-new-nildb-image-${{ matrix.node }}",
              "client_payload":{
                "ref":"${{ github.ref }}",
                "sha":"${{ github.sha }}",
                "tag":"${{ needs.setup.outputs.short_sha }}"
              }
            }'
